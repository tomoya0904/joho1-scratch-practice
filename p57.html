<body>
<header><span class="logo">▣</span><div class="brand"><h1>ブロックでわかるプログラミング</h1><p>学習ノート p.57｜配列・関数・リストを1行ずつ実行</p></div><a class="home" href="./index.html">← p.54〜55の練習に戻る</a></header>
<main class="wrap">

<div class="layout">

<script>
'use strict';
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choice=(question,options,answer,why)=>({type:'choice',question,options,answer,why});
const numbers=(question,fields,answers,why)=>({type:'numbers',question,fields,answers,why});
const STEPS=[
{title:'STEP 1｜合計の箱を準備',desc:'人数を足していく前に、変数「合計」を0にする。緑の旗で実行すると最初に何が起こるか見よう。',hint:'足し算の初期値は0。最初に数字が入っていると、余計な人数まで加算されてしまいます。',quiz:choice('足し算の変数「合計」の初期値は？',['0','1','10'],0,'最初に合計=0としてからクラス人数を足します。')},
{title:'STEP 2｜配列の添字を知る',desc:'下の表で、添字0は1クラス目、添字1は2クラス目。配列の番号は0から始まります。',hint:'10クラスの配列は0,1,2,3,4,5,6,7,8,9の10個。添字10の要素はありません。',quiz:choice('配列「クラス人数[2]」は何クラス目の人数？',['2クラス目','3クラス目','10クラス目'],1,'配列の番号が0から始まるため、添字2は3クラス目です。')},
{title:'STEP 3｜0から9まで繰り返す',desc:'ループの最初はi=0。次はi=1……最後はi=9。1行ずつボタンで確認しよう。',hint:'「0から9まで」は0と9も含めて10回。10まで繰り返すと11回になってしまいます。',quiz:choice('10クラスの全員を足すとき、添字iの最後の数字は？',['9','10','11'],0,'最後の添字は9です。0〜9で合計10個。')},
{title:'STEP 4｜合計に人数を加える',desc:'「合計 ← 合計 + クラス人数[i]」は、これまでの合計にi番目の人数を足して更新します。',hint:'右辺を先に計算し、左辺の「合計」に代入します。ループを回すたびに合計が増えていきます。',quiz:choice('添字0の人数が28、添字1の人数が32なら、2クラス分の合計は？',['32','60','28'],1,'0 + 28 + 32 = 60。配列の値を1つずつ加算します。')},
{title:'本番｜p.57 PRACTICE 1（①〜⑤）',desc:'フローチャートの空欄①〜⑤を、問題のア〜クから選んで答えよう。重複使用できます。',hint:'①どの変数？ ②最初に入れる数？ ③最後の添字？ ④加算先と表示する変数？ ⑤配列のどの要素を使う？',quiz:{type:'arrayfinal',question:'①〜⑤の記号をそれぞれ選んでね。',answers:['オ','ア','ウ','オ','ク'],why:'①オ（合計）、②ア（0）、③ウ（9）、④オ（合計）、⑤ク（クラス人数[i]）。'}}
];
const STEPS2=[
{title:'STEP 1｜好きな2桁の数を入力',desc:'自分と友達の2桁の数を入力し、それぞれ「好きな数1」「好きな数2」に保存します。',hint:'「変数」は数値を保存する箱。下の入力欄に別の数を入れて実験できます。',quiz:choice('「好きな数1」「好きな数2」は何を保存するもの？',['入力された2つの数','リストの文章','1秒の時間'],0,'2人が入力した数をそれぞれの変数に保存します。')},
{title:'STEP 2｜和の下1桁を求める',desc:'2つの数を足し、その合計をユーザ定義ブロック「リスト添字決定」に渡します。',hint:'下1桁は10で割った余り。例：23＋41＝64 → 64÷10の余り4。',quiz:choice('23と41の和について、10で割った余りは？',['6','4','2'],1,'23＋41＝64、64÷10の余りは4です。')},
{title:'STEP 3｜引数とリストの添字',desc:'受け取った「診断数」を10で割った余りで、リストの1番目・2番目・3番目を選びます。',hint:'余りが0・1なら添字1、2〜4なら添字2、5〜9なら添字3。ユーザ定義ブロックの引数名は「診断数」です。',quiz:choice('診断数を10で割った余りが5なら、添字は？',['1','2','3'],2,'5〜9のときは添字3に設定します。')},
{title:'STEP 4｜積の下1桁でもう一度',desc:'続いて2つの数を掛け算し、同じユーザ定義ブロックを呼び出します。結果を「相性リスト」から表示します。',hint:'23×41＝943 → 余り3 → 添字2。同じ関数でも、渡す値（引数）が違うと結果が変わります。',quiz:choice('23×41=943 の下1桁が3なら、添字は？',['1','2','3'],1,'余りが2〜4の範囲なのでリストの添字は2になります。')},
{title:'本番｜p.57 PRACTICE 2（⑴・⑵）',desc:'学習ノートの図を確認して、引数名と①〜③に入る数を答えよう。',hint:'関数名は「リスト添字決定」。引数名は関数定義の丸い部分。下1桁を求める割る数、余りの境界値を考えよう。',quiz:{type:'functionfinal',question:'⑴引数名、⑵①〜③の4か所を埋めよう。',answers:['診断数','10','2','5'],why:'⑴は「診断数」。⑵の①=10、②=2、③=5です。余りが0,1なら1／2〜4なら2／5〜9なら3。'}}
];
const LESSONS=[{id:'array',title:'p.57 PRACTICE 1｜配列と合計',short:'10クラスの人数を合計',steps:STEPS},{id:'function',title:'p.57 PRACTICE 2｜関数と相性診断',short:'和・積・リストの添字',steps:STEPS2}];
const DEFAULTS={array:[28,32,30,29,31,27,35,33,26,34],person1:23,person2:41};
const LABELS=['ア 0','イ 1','ウ 9','エ 10','オ 合計','カ クラス人数','キ 合計[i]','ク クラス人数[i]'];
const term=['永久に','今月は','今日は'],relation=['抜群！！','まあまあ','ごく普通'];
let lesson=0,step=0,values={array:DEFAULTS.array.slice(),person1:DEFAULTS.person1,person2:DEFAULTS.person2},trace=[],pos=0,timer=null,finished={};
try{finished=JSON.parse(localStorage.getItem('blockwork57_progress')||'{}')||{}}catch(e){finished={}}
const key=()=>LESSONS[lesson].id+'-'+step;
function save(){try{localStorage.setItem('blockwork57_progress',JSON.stringify(finished))}catch(e){}}
function nav(){const el=$('#nav');el.innerHTML=LESSONS.map((l,i)=>`<button class="${i===lesson?'active':''}" data-l="${i}" type="button"><span class="num">${i+1}</span><span><b>${safe(l.title)}</b><small>${safe(l.short)}　${l.steps.every((_,s)=>finished[l.id+'-'+s])?'✓ 完了':''}</small></span></button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>selectLesson(+b.dataset.l,0));}
function quiz(){const q=LESSONS[lesson].steps[step].quiz;let html='';if(q.type==='choice'){html='<div class="choices">'+q.options.map((v,i)=>`<label class="choice"><input name="answerChoice" type="radio" value="${i}">${safe(v)}</label>`).join('')+'</div>';}else if(q.type==='arrayfinal'){html='<div class="answers">'+q.answers.map((_,i)=>`<div class="ansrow"><label for="a${i}">空欄 ${'①②③④⑤'[i]}</label><select id="a${i}"><option value="">選択してね</option>${LABELS.map((x,k)=>`<option value="${'アイウエオカキク'[k]}">${x}</option>`).join('')}</select></div>`).join('')+'</div>';}else if(q.type==='functionfinal'){html='<div class="answers">'+['⑴ 引数名','⑵①','⑵②','⑵③'].map((x,i)=>`<div class="ansrow"><label for="a${i}">${x}</label><input id="a${i}" ${i?'inputmode="numeric"':'autocomplete="off"'} placeholder="${i?'数字で入力':'文字で入力'}"></div>`).join('')+'</div>';}$('#answer').innerHTML=html;}
function drawLesson(){const l=LESSONS[lesson],s=l.steps[step];$('#pageTitle').textContent=l.title;$('#pageSub').textContent=lesson===0?'初期化 → 添字 → 加算 → 解答':'2つの数 → 下1桁 → 引数 → リスト → 解答';$('#progress').textContent=`${Object.keys(finished).filter(k=>finished[k]).length} / 10 STEP 完了`;$('#stepCount').textContent=`${step+1} / ${l.steps.length}`;$('#stepTitle').textContent=s.title;$('#desc').textContent=s.desc;$('#hint').textContent=s.hint;$('#question').textContent=s.quiz.question;$('#feedback').className='';$('#feedback').textContent='';$('#chips').innerHTML=l.steps.map((_,i)=>`<button data-s="${i}" class="${i===step?'active':''} ${finished[l.id+'-'+i]?'done':''}" type="button">${finished[l.id+'-'+i]?'✓':i+1}</button>`).join('');$('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>selectLesson(lesson,+b.dataset.s));$('#prev').disabled=step===0;$('#next').disabled=!finished[key()];$('#next').textContent=step===4?(lesson===0?'次のPRACTICE →':'最初に戻る ↺'):'次のステップ →';quiz();nav();}
function checkQuiz(){const q=LESSONS[lesson].steps[step].quiz;let ok=false,msg='';if(q.type==='choice'){const a=$('input[name="answerChoice"]:checked');ok=!!a&&+a.value===q.answer;msg=a?'':'選択肢を1つ選んでね。';}else if(q.type==='arrayfinal'){const ans=q.answers.map((_,i)=>$('#a'+i).value);ok=ans.every((a,i)=>a===q.answers[i]);msg=ans.some(a=>!a)?'空欄①〜⑤をすべて選ぼう。':'';}else if(q.type==='functionfinal'){const ans=q.answers.map((_,i)=>$('#a'+i).value.trim().replace(/\s+/g,''));ok=ans.every((a,i)=>a===q.answers[i]);msg=ans.some(a=>!a)?'全部の空欄を埋めよう。':'';}const box=$('#feedback');box.className='feedback '+(ok?'good':'bad');box.textContent=ok?'🎉 正解！ '+q.why:msg||'もう一度考えてみよう。右側の実行を参考にしてね。';if(ok){finished[key()]=true;save();$('#next').disabled=false;drawProgress();}}
function drawProgress(){nav();$('#progress').textContent=`${Object.keys(finished).filter(k=>finished[k]).length} / 10 STEP 完了`;const chip=$(`#chips button[data-s="${step}"]`);if(chip){chip.classList.add('done');chip.textContent='✓';}}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}}
function selectLesson(l,s){stop();lesson=l;step=s;history.replaceState(null,'',`#${LESSONS[l].id}`);drawLesson();drawEditor();resetRun();window.scrollTo({top:0,behavior:'smooth'});}
function updateValue(name,value){if(name==='person1'||name==='person2'){const n=Math.trunc(Number(value));values[name]=Number.isFinite(n)?Math.min(99,Math.max(10,n)):23;}else{const index=+name.replace('a','');const n=Math.trunc(Number(value));values.array[index]=Number.isFinite(n)?Math.min(999,Math.max(0,n)):0;}resetRun();drawEditor();}
function drawEditor(){if(lesson===0){$('#blocks').innerHTML=`<div class="block variable" data-b="init">変数 <span class="pill">合計</span> を <span class="pill">0</span> にする</div><div class="block control" data-b="loop">添字 <span class="pill">i</span> を <span class="pill">0</span> から <span class="pill">9</span> まで繰り返す<div class="inside"><div class="block variable" data-b="add">変数 <span class="pill">合計</span> に <span class="oval">クラス人数[i]</span> を加える</div></div></div><div class="block say" data-b="show"><span class="pill">合計</span> を2秒言う</div>`;$('#editable').innerHTML=`<b>📊 配列「クラス人数」：10クラス分</b><p>添字0から9までの数値を変更できます。</p><div class="arraygrid">${values.array.map((v,i)=>`<div class="arrayitem"><label for="edit-a${i}">[${i}]</label><input type="number" id="edit-a${i}" data-value="a${i}" min="0" max="999" value="${v}" aria-label="クラス人数添字${i}"></div>`).join('')}</div>`;}else{const a=values.person1,b=values.person2;$('#blocks').innerHTML=`<div class="block ask" data-b="ask1">「好きな2桁の数」を聞いて <span class="pill">好きな数1</span> にする</div><div class="block ask" data-b="ask2">「友達の好きな2桁の数」を聞いて <span class="pill">好きな数2</span> にする</div><div class="block function" data-b="sumcall">リスト添字決定 <span class="oval">好きな数1 ＋ 好きな数2</span></div><div class="block say" data-b="sumshow"><span class="pill">有効期間リスト [ リスト添字 ]</span> 番目を2秒言う</div><div class="block function" data-b="mulcall">リスト添字決定 <span class="oval">好きな数1 × 好きな数2</span></div><div class="block say" data-b="mulshow"><span class="pill">相性リスト [ リスト添字 ]</span> 番目を2秒言う</div><div class="definebox"><small>🧩 ユーザ定義ブロックの中身（呼び出すたびに実行）</small><div class="block define" data-b="define">定義 リスト添字決定 <span class="pill">診断数</span></div><div class="block control" data-b="remainder">診断数 を <span class="oval">10</span> で割った余りを求める</div><div class="block control" data-b="branch">もし 余り ＜ <span class="pill">2</span> なら → 添字1<br>でなければ 余り ＜ <span class="pill">5</span> なら → 添字2<br>それ以外 → 添字3</div></div>`;$('#editable').innerHTML=`<b>🔢 2人の好きな2桁の数</b><p>数字を変更すると「和・積・リストの結果」も変わります。</p><div class="answers"><div class="ansrow"><label for="person1">好きな数1</label><input type="number" data-value="person1" id="person1" min="10" max="99" value="${a}"></div><div class="ansrow"><label for="person2">好きな数2</label><input type="number" data-value="person2" id="person2" min="10" max="99" value="${b}"></div></div>`;}
$('#editable').querySelectorAll('[data-value]').forEach(el=>el.addEventListener('change',()=>updateValue(el.dataset.value,el.value)));}
function compile(){let events=[],v={},sum=0;const emit=(bid,title,detail,bubble)=>events.push({bid,title,detail,bubble,vars:{...v}});if(lesson===0){v['合計']=0;emit('init','合計を0にする','足し算を始めるので0に初期化します。','合計 = 0');values.array.forEach((amount,i)=>{v.i=i;emit('loop',`添字 i = ${i}`,`クラス人数[${i}] は ${amount} 人。${i+1}クラス目です。`,`i = ${i}`);const before=v['合計'];v['合計']+=amount;emit('add',`合計：${before} ＋ ${amount} = ${v['合計']}`,`クラス人数[${i}] の${amount}人を加えました。`,`合計 ${v['合計']} 人`);});emit('show',`最終合計：${v['合計']}人`,`添字0〜9の10個すべてを合計しました。`,`🐱 ${v['合計']} 人`);}else{v['好きな数1']=values.person1;emit('ask1',`1人目：${values.person1}`,`「好きな数1」に${values.person1}を代入。`,`入力：${values.person1}`);v['好きな数2']=values.person2;emit('ask2',`2人目：${values.person2}`,`「好きな数2」に${values.person2}を代入。`,`入力：${values.person2}`);function call(n,bid){v['診断数']=n;emit(bid,`引数「診断数」に ${n} を渡す`,`ユーザ定義ブロック「リスト添字決定(${n})」を呼び出します。`,`診断数 = ${n}`);v['余り']=n%10;emit('remainder',`${n} ÷ 10 の余り = ${v['余り']}`,`余りで下1桁を取り出しました。`,`余り ${v['余り']}`);const x=v['余り'];v['リスト添字']=x<2?1:x<5?2:3;emit('branch',`余り${x} → リストの${v['リスト添字']}番目`,`0・1なら1、2〜4なら2、5〜9なら3です。`,`添字 ${v['リスト添字']}`);}
call(values.person1+values.person2,'sumcall');v['有効期間']=term[v['リスト添字']-1];emit('sumshow',`有効期間：${v['有効期間']}`,`有効期間リストの${v['リスト添字']}番目を表示します。`,`🐱 ${v['有効期間']}`);call(values.person1*values.person2,'mulcall');v['相性']=relation[v['リスト添字']-1];emit('mulshow',`相性：${v['相性']}`,`相性リストの${v['リスト添字']}番目を表示します。`,`🐱 ${v['相性']}`);}return events;}
function resetRun(){stop();trace=[];pos=0;$('#status').textContent='待機中';$('#speech').textContent='緑の旗でスタート！';$('#watch').innerHTML='<span class="tiny">まだ実行していません</span>';$('#traceTitle').textContent='まだ実行していません';$('#traceDetail').textContent='「1行ずつ」で値の変化を見よう。';$('#traceCount').textContent='0 / 0';$('#logs').innerHTML='';$('#arrayWatch').innerHTML='';document.querySelectorAll('.activeblock').forEach(x=>x.classList.remove('activeblock'));}
function startTrace(){resetRun();trace=compile();}
function advance(){if(!trace.length)startTrace();if(pos>=trace.length){stop();$('#status').textContent='実行完了！';return false;}const e=trace[pos++];document.querySelectorAll('.activeblock').forEach(x=>x.classList.remove('activeblock'));const active=document.querySelector(`[data-b="${e.bid}"]`);if(active){active.classList.add('activeblock');}$('#traceTitle').textContent=e.title;$('#traceDetail').textContent=e.detail;$('#speech').textContent=e.bubble;$('#traceCount').textContent=`${pos} / ${trace.length}`;$('#watch').innerHTML=Object.entries(e.vars).filter(([name])=>name!=='有効期間'&&name!=='相性').map(([name,value])=>`<div class="v"><small>${safe(name)}</small><strong>${safe(value)}</strong></div>`).join('');if(lesson===0){$('#arrayWatch').innerHTML=`<b style="font-size:12px">配列「クラス人数」</b><div class="arraywatch">${values.array.map((v,i)=>`<div class="aw ${e.vars.i===i?'active':''}"><small>[${i}]</small><b>${v}</b></div>`).join('')}</div>`;}else{$('#arrayWatch').innerHTML=`<b style="font-size:12px">リストの中身</b><div class="listr">${term.map((v,i)=>`<span class="${e.bid==='sumshow'&&e.vars['リスト添字']===i+1?'active':''}">${i+1}：${v}</span>`).join('')}</div><div class="listr">${relation.map((v,i)=>`<span class="${e.bid==='mulshow'&&e.vars['リスト添字']===i+1?'active':''}">${i+1}：${v}</span>`).join('')}</div>`;}const row=document.createElement('div');row.className='logrow';row.innerHTML=`<b>${pos}.</b>${safe(e.title)}`;$('#logs').append(row);$('#logs').scrollTop=$('#logs').scrollHeight;$('#status').textContent=pos===trace.length?'実行完了！':'実行中';if(pos===trace.length){stop();return false;}return true;}
$('#check').onclick=checkQuiz;$('#prev').onclick=()=>selectLesson(lesson,Math.max(0,step-1));$('#next').onclick=()=>{if(!finished[key()])return;if(step<4)selectLesson(lesson,step+1);else if(lesson===0)selectLesson(1,0);else selectLesson(0,0);};$('#step').onclick=()=>{stop();if(pos>=trace.length)startTrace();advance();};$('#run').onclick=()=>{stop();startTrace();advance();timer=setInterval(()=>{if(!advance())stop();},+$('#speed').value);};$('#stop').onclick=()=>{stop();$('#status').textContent='停止しました';};$('#reset').onclick=()=>{values={array:DEFAULTS.array.slice(),person1:DEFAULTS.person1,person2:DEFAULTS.person2};drawEditor();resetRun();};
selectLesson(location.hash==='#function'?1:0,0);
</script>
</body>
